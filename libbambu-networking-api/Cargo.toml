[package]
name = "open-bambu-net"
version = "0.1.0"
edition = "2021"

[build]
lto = "off"

[lib]
name = "bambu_networking"  # Match the closed-source library name
crate-type = ["cdylib", "rlib"]  # cdylib for shared library, rlib for rust usage

[dependencies]
config = { version = "0.15.19", features = ["toml"] }
cxx = "1.0.189"
futures = "0.3.31"
lazy_static = "1.5.0"
env_logger = "0.11.8"
log = "0.4.28"
rustls-native-certs = "0.8.2"
tokio = { version = "1.48.0", features = ["full"] }
open-bambu-core = { path = "../core" }
paho-mqtt = "0.13.3"

[build-dependencies]
cc = { version = "1.2.47", features = ["parallel"] }
cxx-build = "1.0.189"

[dev-dependencies]
reqwest = { version = "0.12.24", features = ["json", "blocking"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
assert_matches = "1.5.0"
base64 = "0.22.1"
